name: Refresh sunbed locations

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/refresh.yml"
      - "discover_sunbeds.py"
      - "requirements.txt"
  workflow_dispatch:
  schedule:
    - cron: "23 5 3 * *"

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Discover locations
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python discover_sunbeds.py

      - name: Commit refreshed store list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stores.json
          git diff --cached --quiet || git commit -m "Refresh sunbed locations [automated]"
          git pull --rebase
          git push
